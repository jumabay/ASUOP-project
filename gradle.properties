# Project-local Gradle settings (committed).
# Encoding for Windows consoles / reports.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8

# Java toolchain is declared in build.gradle.kts (languageVersion = 21).
#
# Do NOT set org.gradle.java.home in THIS file to force JDK 21:
# GRADLE_USER_HOME/gradle.properties (often ~/.gradle) has HIGHER precedence than the
# project file. On this machine ~/.gradle/gradle.properties may pin JDK 17 and would win.
#
# Agents / local Windows: use scripts/gradle-jdk21.ps1 (isolated ASCII GRADLE_USER_HOME
# + JAVA_HOME 21 + subst for Cyrillic repo paths). See docs/agents/BUILD_JDK21_WINDOWS.md.
