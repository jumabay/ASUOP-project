spring:
  application:
    name: railway-platform
  profiles:
    default: synthetic

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: synthetic

# Synthetic profile: no DataSource, no Oracle JDBC URL, no credentials.
# DataSourceAutoConfiguration remains excluded on RailwayPlatformApplication.
logging:
  level:
    root: INFO
    platform: INFO

---
spring:
  config:
    activate:
      on-profile: raildb-test

# P4-0 stubs only — do NOT activate for normal development.
# Fail-fast RailDb* port adapters; still no datasource URL/username/password.
# Activating raildb-test alone must NOT fall back to synthetic adapters.
# Future (separate approve): JDBC to RAILDB service (not RAC.WORLD / not RAC RAIL_APP schema),
# password from ${RAIL_DB_PASSWORD}, Flyway disabled by default.
logging:
  level:
    root: INFO
    platform: INFO

---
spring:
  config:
    activate:
      on-profile: dbtc-ro

# P5-E time-boxed RO (APPROVED until 2026-11-25 18:00 +05:00). NOT default.
# Password: env ASUOP_ORACLE_PASSWORD only. Do not commit secrets.
asuop:
  dbtc:
    jdbc-url: jdbc:oracle:thin:@//tc-asuvp-03:1521/RAC.WORLD
    user: Dbtc
logging:
  level:
    root: INFO
    platform: INFO
